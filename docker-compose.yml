services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATA_PATH: /app/data
      DB_PATH: /app/db
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./db:/app/db

  frontend:
    image: python:3.12-slim
    working_dir: /frontend
    command: python -m http.server 5500 --bind 0.0.0.0
    ports:
      - "5500:5500"
    volumes:
      - ./frontend:/frontend:ro
    depends_on:
      - api
